<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NexX Esports Registration</title>

<style>

body{
background:#0a0a0a;
color:white;
font-family:Arial, sans-serif;
text-align:center;
margin:0;
padding:0;
}

.container{
width:360px;
margin:auto;
margin-top:40px;
padding:25px;
background:#141414;
border-radius:10px;
box-shadow:0 0 15px rgba(0,229,255,0.3);
}

h1{
color:#00e5ff;
margin-bottom:10px;
}

.info{
font-size:14px;
color:#ccc;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

.paybtn{
background:#00ff9d;
color:black;
}

.submitbtn{
background:#00e5ff;
color:black;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
background:#1f1f1f;
color:white;
}

.note{
font-size:13px;
color:#aaa;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Free Fire Solo Tournament</h1>

<p class="info">
Room B305 • 28 March • 3:30 PM
</p>

<p><b>Entry Fee: ₹20</b></p>

<!-- Payment Button -->

<button class="paybtn"
onclick="window.open('https://pay.mypaylink.in/?q=n4pbIe','_blank')">
Pay ₹20 Entry Fee
</button>

<p class="note">
After payment, copy the Transaction ID and fill the form.
</p>

<!-- Registration Form -->

<form id="regForm">

<input type="text" name="name" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<input type="text" name="uid" placeholder="Free Fire UID" required>

<input type="text" name="department" placeholder="Department / Course" required>

<input type="text" name="payment" placeholder="Payment Transaction ID" required>

<button type="submit" class="submitbtn">
Submit Registration
</button>

</form>

<p class="note">
Only 50 players allowed.
Invalid transaction IDs will be rejected.
</p>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbw44YMAcIDDMHw5ES52eHvMCngBiqCUQIITsvBQr4HuLfvBMkx8sfXNjmMM5tjqoWno3w/exec";

const form = document.getElementById("regForm");

form.addEventListener("submit", function(e){

e.preventDefault();

const formData = new FormData(form);

fetch(scriptURL,{
method:"POST",
body:formData
})
.then(res => res.text())
.then(() => {

alert("Registration Successful!");

form.reset();

})
.catch(err => {

alert("Error submitting form");

});

});

</script>

</body>
</html>
