<!DOCTYPE html>
<html>
<head>
<title>NexX Esports Registration</title>

<style>

body{
background:#0a0a0a;
color:white;
font-family:Arial;
text-align:center;
}

form{
width:320px;
margin:auto;
margin-top:40px;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:6px;
}

button{
background:#00e5ff;
color:black;
font-weight:bold;
}

</style>

</head>

<body>

<h2>Free Fire Solo Tournament</h2>
<p>MUIT | Entry ₹20 | Only 50 Players</p>

<form id="regForm">

<input name="name" placeholder="Full Name" required>

<input name="phone" placeholder="Phone Number" required>

<input name="uid" placeholder="Free Fire UID" required>

<input name="department" placeholder="Department" required>

<input name="payment" placeholder="Payment Transaction Id" required>

<button type="submit">Register</button>

</form>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbw44YMAcIDDMHw5ES52eHvMCngBiqCUQIITsvBQr4HuLfvBMkx8sfXNjmMM5tjqoWno3w/exec";

document.getElementById("regForm").addEventListener("submit", e =>{

e.preventDefault();

const formData = new FormData(e.target);
const data = Object.fromEntries(formData);

fetch(scriptURL,{
method:"POST",
body:JSON.stringify(data)
})
.then(res=>res.json())
.then(()=>{
alert("Registration Successful");
});

});

</script>

</body>
</html>
