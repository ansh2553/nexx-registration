<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>NexX Esports Registration</title>

<style>

body{
background:#0a0a0a;
color:white;
font-family:Arial, sans-serif;
text-align:center;
margin:0;
padding:0;
}

.container{
width:360px;
margin:auto;
margin-top:40px;
padding:25px;
background:#141414;
border-radius:10px;
box-shadow:0 0 20px rgba(0,229,255,0.2);
}

h1{
color:#00e5ff;
margin-bottom:5px;
}

.subtitle{
font-size:14px;
color:#bbb;
margin-bottom:15px;
}

.paybtn{
background:#00ff9d;
color:black;
font-weight:bold;
cursor:pointer;
padding:12px;
border:none;
border-radius:6px;
width:100%;
margin-top:10px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
background:#1f1f1f;
color:white;
}

.submitbtn{
background:#00e5ff;
color:black;
font-weight:bold;
cursor:pointer;
padding:12px;
border:none;
border-radius:6px;
width:100%;
margin-top:15px;
}

.note{
font-size:13px;
color:#aaa;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Free Fire Solo Tournament</h1>

<p class="subtitle">
MUIT | Room B305 | 28 March | 3:30 PM
</p>

<p><b>Entry Fee: ₹20</b></p>

<!-- PAYMENT BUTTON -->

<a href="https://pay.mypaylink.in/?q=n4pbIe" target="_blank">
<button class="paybtn">Pay ₹20 Entry Fee</button>
</a>

<p class="note">
Step 1: Click the button and complete payment.<br>
Step 2: Copy your payment Transaction ID.<br>
Step 3: Fill the form below.
</p>

<!-- REGISTRATION FORM -->

<form id="regForm">

<input name="name" placeholder="Full Name" required>

<input name="phone" placeholder="Phone Number" required>

<input name="uid" placeholder="Free Fire UID" required>

<input name="department" placeholder="Department / Course" required>

<input name="transactionid" placeholder="Payment Transaction ID" required>

<button class="submitbtn" type="submit">
Submit Registration
</button>

</form>

<p class="note">
Only 50 players allowed. Invalid transaction IDs will be rejected.
</p>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbw44YMAcIDDMHw5ES52eHvMCngBiqCUQIITsvBQr4HuLfvBMkx8sfXNjmMM5tjqoWno3w/exec";

document.getElementById("regForm").addEventListener("submit", function(e){

e.preventDefault();

const formData = new FormData(this);
const data = Object.fromEntries(formData.entries());

fetch(scriptURL,{
method:"POST",
body:JSON.stringify(data)
})
.then(res => res.json())
.then(response => {

alert("Registration Successful!");

document.getElementById("regForm").reset();

})
.catch(error => alert("Error submitting form"));

});

</script>

</body>
</html>
